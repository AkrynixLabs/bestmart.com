# Local development database only. Production uses Neon.
# Port 5433 on the host so it doesn't clash with a system Postgres on 5432.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bestmart
      POSTGRES_PASSWORD: bestmart
      POSTGRES_DB: bestmart
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - bestmart-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bestmart -d bestmart"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  bestmart-db:
