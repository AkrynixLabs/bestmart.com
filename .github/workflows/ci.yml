name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://bestmart:bestmart@localhost:5432/bestmart
  DIRECT_URL: postgresql://bestmart:bestmart@localhost:5432/bestmart
  NEXT_PUBLIC_APP_URL: http://localhost:3100

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bestmart
          POSTGRES_PASSWORD: bestmart
          POSTGRES_DB: bestmart
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bestmart -d bestmart"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prisma schema is valid
        run: npx prisma validate
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      # Runtime deps only. "critical" for now because of a high-severity
      # picomatch advisory with no fixed version (build-time only, see docs/SECURITY.md).
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=critical
